name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

# Read-only by default: these jobs run code from the PR branch. Jobs that push
# to the PR branch ask for write access themselves.
permissions:
  contents: read

jobs:
  mstack:
    name: mstack lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: justmatias/mstack@690fb9d068ff735a47099d016823cdbbf0fb611f

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run lint and format checks
        id: format
        continue-on-error: true
        run: uv run poe format

      - name: Commit autofixed formatting issues
        if: steps.format.outcome == 'failure' && github.event_name == 'pull_request' && matrix.python-version == '3.13'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "style: apply automated formatting fixes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail if lint or format issues were found
        if: steps.format.outcome == 'failure'
        run: exit 1

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run poe test

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Run pip-audit
        run: uvx pip-audit --local

  update-hooks:
    name: Update pre-commit hooks
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Autoupdate pre-commit hooks
        run: uv run pre-commit autoupdate

      - name: Sync uv additional dependencies
        run: uv run pre-commit run hookpin --all-files || true

      - name: Commit updated hooks
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "chore(config): update pre-commit hooks"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [mstack, lint, test, security]
    permissions:
      contents: write
    concurrency:
      group: release
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the merged version and create the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version=$(python3 -c 'import runpy; print(runpy.run_path("agentctl/__init__.py")["__version__"])')
          previous_version=$(git show "$BEFORE_SHA:agentctl/__init__.py" | cut -d '"' -f 2)
          if [[ "$version" == "$previous_version" ]]; then
            exit 0
          fi
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            if [[ "$(git rev-list -1 "$tag")" != "$(git rev-parse HEAD)" ]] ||
               gh release view "$tag" >/dev/null 2>&1; then
              exit 0
            fi
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" --verify-tag --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

