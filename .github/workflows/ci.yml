name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr-title:
    name: Standardize PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-generate conventional PR title
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          if echo "$CURRENT_TITLE" | grep -qE "$PATTERN"; then
            echo "Title already conventional, skipping."
            exit 0
          fi
          FIRST_COMMIT_SUBJECT=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[0].commit.message' | head -1)
          if echo "$FIRST_COMMIT_SUBJECT" | grep -qE "$PATTERN"; then
            NEW_TITLE="$FIRST_COMMIT_SUBJECT"
          else
            NEW_TITLE="chore: $FIRST_COMMIT_SUBJECT"
          fi
          gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$NEW_TITLE"

      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mstack:
    name: mstack lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: justmatias/mstack@690fb9d068ff735a47099d016823cdbbf0fb611f

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run lint and format checks
        id: format
        continue-on-error: true
        run: uv run poe format

      - name: Commit autofixed formatting issues
        if: steps.format.outcome == 'failure' && github.event_name == 'pull_request' && matrix.python-version == '3.13'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "style: apply automated formatting fixes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail if lint or format issues were found
        if: steps.format.outcome == 'failure'
        run: exit 1

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run poe test

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Run pip-audit
        run: uvx pip-audit --local

  update-hooks:
    name: Update pre-commit hooks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Autoupdate pre-commit hooks
        run: uv run pre-commit autoupdate

      - name: Sync uv additional dependencies
        run: uv run pre-commit run hookpin --all-files || true

      - name: Commit updated hooks
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "chore(config): update pre-commit hooks"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

  prepare-release:
    name: Prepare release in PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [pr-title, lint, update-hooks]
    permissions:
      actions: write
      contents: write
      pull-requests: read
    concurrency:
      group: prepare-release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"
          install-dependencies: "false"

      - name: Update version and changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr=$(gh pr view "$PR_NUMBER" --json headRefOid,title --jq '[.headRefOid,.title] | @tsv')
          IFS=$'\t' read -r head title <<< "$pr"
          if [[ "$head" != "$(git rev-parse HEAD)" ]]; then
            exit 0
          fi

          breaking='^[a-z]+(\([^)]*\))?!:'
          feature='^feat(\([^)]*\))?:'
          fix='^(fix|perf)(\([^)]*\))?:'
          level=
          if [[ "$title" =~ $breaking ]]; then
            level=major
          elif [[ "$title" =~ $feature ]]; then
            level=minor
          elif [[ "$title" =~ $fix ]]; then
            level=patch
          fi

          base=$(git merge-base "origin/$BASE_REF" HEAD)
          previous=$(git log --format=%H --author='github-actions\[bot\]' \
            --grep='^chore(release): prepare PR version$' "$base..HEAD")
          if [[ -z "$level" && -z "$previous" ]]; then
            exit 0
          fi

          release_files=(agentctl/__init__.py CHANGELOG.md)
          if [[ -n "$previous" ]]; then
            # Reverse only previous bot changes, preserving edits made by contributors.
            mapfile -t release_commits <<< "$previous"
            git revert --no-commit "${release_commits[@]}"
            git revert --quit
          fi
          if [[ -n "$level" ]]; then
            if ! git diff --quiet "$base" "origin/$BASE_REF" -- "${release_files[@]}"; then
              echo "::error::Update the PR branch from $BASE_REF before preparing a release."
              exit 1
            fi
            # Wait for the preceding release to be tagged before calculating the next bump.
            version=$(git show "$base:agentctl/__init__.py" | cut -d '"' -f 2)
            if ! git merge-base --is-ancestor "refs/tags/v$version" "$base" 2>/dev/null; then
              echo "::error::The base version v$version must be tagged before preparing a release."
              exit 1
            fi
            git switch -C main
            env -u GITHUB_OUTPUT uvx --from python-semantic-release==10.7.0 semantic-release version \
              "--$level" --no-commit --no-tag --no-push --no-vcs-release
          fi

          git add -- "${release_files[@]}"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): prepare PR version"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          elif [[ "${GITHUB_RUN_ATTEMPT:-1}" == 1 || -z "$previous" ]]; then
            exit 0
          fi
          # Dispatch CI because a GITHUB_TOKEN push may require approval to run PR checks.
          gh workflow run ci.yml --ref "$HEAD_REF"

  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [mstack, lint, test, security]
    permissions:
      contents: write
    concurrency:
      group: release
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the merged version and create the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version=$(python3 -c 'import runpy; print(runpy.run_path("agentctl/__init__.py")["__version__"])')
          previous_version=$(git show "$BEFORE_SHA:agentctl/__init__.py" | cut -d '"' -f 2)
          if [[ "$version" == "$previous_version" ]]; then
            exit 0
          fi
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            if [[ "$(git rev-list -1 "$tag")" != "$(git rev-parse HEAD)" ]] ||
               gh release view "$tag" >/dev/null 2>&1; then
              exit 0
            fi
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" --verify-tag --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

