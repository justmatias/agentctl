# Written by `mstack init --ci github`: the full scan on every push, and on pull
# requests also the changed-files scan, where warnings fail too.
name: mstack

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: mstack lint
    runs-on: ubuntu-latest
    steps:
      # The changed-files scan needs the base branch: keep the full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: justmatias/mstack@v5.1.1
