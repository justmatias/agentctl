name: PR title

# Separate from CI so that editing a PR's title or description reruns only this
# check, not the whole CI suite.
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
