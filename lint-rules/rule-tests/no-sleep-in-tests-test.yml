id: no-sleep-in-tests
valid:
  # Near miss: yielding to the event loop is not waiting for time.
  - |
    async def test_task_runs():
        await asyncio.sleep(0)
        assert task.done()
  # Near miss: a method named sleep on an injected simulated clock.
  - |
    def test_retry_waits(simulated_clock):
        retry(do_work, clock=simulated_clock)
        simulated_clock.sleep(5)
        assert simulated_clock.now() == 5
  - |
    def test_job_finishes(job):
        wait_until(lambda: job.finished, timeout=5)
