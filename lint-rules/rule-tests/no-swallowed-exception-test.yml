id: no-swallowed-exception
valid:
  - |
    try:
        do_work()
    except Exception:
        log.exception("do_work failed")
  - |
    try:
        do_work()
    except KeyError:
        pass
  - |
    try:
        do_work()
    except Exception as error:
        log.warning("ignored: %s", error)
        pass
invalid:
  # Same code as fixtures/invalid/error-handling/swallowed_exception.py
  - |
    def do_work(callback):
        try:
            callback()
        except Exception:
            pass


    def do_other_work(callback):
        try:
            callback()
        except Exception as error:
            pass
  - |
    try:
        do_work()
    except BaseException:
        pass
  - |
    try:
        do_work()
    except Exception as error:
        pass
