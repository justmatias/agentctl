id: no-swallowed-exception
language: Python
severity: error
message: "Handle, log or re-raise the exception instead of `except Exception: pass`"
note: |
  A swallowed exception hides the failure until it surfaces far
  from its cause.
metadata:
  source: .cursor/rules/error-handling.mdc
rule:
  kind: except_clause
  all:
    - has:
        field: value
        any:
          - regex: ^(Exception|BaseException)$
          - kind: as_pattern
            has:
              nthChild: 1
              regex: ^(Exception|BaseException)$
    - has:
        kind: block
        all:
          - has:
              kind: pass_statement
          - not:
              has:
                nthChild: 2
